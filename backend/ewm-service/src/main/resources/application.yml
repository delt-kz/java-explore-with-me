server:
  port: 8080

statistics:
  client:
    url: http://stats-server:9090

spring:
  profiles:
    active:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/ewm
    username: ewm
    password: ewm

logging:
  level:
    org:
      springframework:
        orm:
          jpa: DEBUG
          jpa.JpaTransactionManager: DEBUG
        transaction: INFO
        transaction.interceptor: DEBUG
        web: DEBUG
        web.servlet.DispatcherServlet: TRACE
